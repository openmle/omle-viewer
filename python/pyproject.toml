[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omle-viewer"
dynamic = ["version"]
description = "Interactive DAG viewer for OMLE models — Jupyter display and browser CLI"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "OMLE" }]
keywords = [
    "machine learning", "omle", "visualization", "dag", "jupyter", "viewer",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "omle",
]

[project.urls]
Homepage = "https://github.com/openmle/omle-viewer"
Repository = "https://github.com/openmle/omle-viewer"
Issues = "https://github.com/openmle/omle-viewer/issues"
"OMLE format" = "https://github.com/openmle/omle"

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.0",
    "pytest>=8.0",
    "ruff>=0.16",
    # Local enforcement of ../.pre-commit-config.yaml. The hook lives in
    # .git/hooks/, which no clone inherits, so it needs a one-time
    # `pre-commit install` per checkout; CI runs the same config.
    "pre-commit>=4.0",
]

[tool.ruff]
# Google Python Style Guide: 4-space indent, 80-column limit.
line-length = 80
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "N", "B"]

[tool.ruff.lint.per-file-ignores]
"src/omle_viewer/__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["omle", "omle_viewer"]

[project.scripts]
omle-viewer = "omle_viewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omle_viewer*"]

[tool.setuptools.package-data]
omle_viewer = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools_scm]
# The Python package lives in python/ inside the repo; point setuptools-scm at
# the git root one level up so it can read tags.
root = ".."
version_file = "src/omle_viewer/_version.py"
